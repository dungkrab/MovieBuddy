# ตัวอย่างเท่านั้น — ใน AWS ควรดึงจาก Secrets Manager (External Secrets / CSI driver) แทนการ commit ไฟล์นี้
apiVersion: v1
kind: Secret
metadata: { name: app-secrets }
type: Opaque
stringData:
  INTERNAL_KEY: "change-me-32+chars"
  AUTH_SECRET: "change-me-32+chars"
  TMDB_ACCESS_TOKEN: ""
  REDIS_URL: "redis://<elasticache-endpoint>:6379"
  DB_LOCATION: "postgresql://user:pass@<rds-endpoint>:5432/location"
  DB_CINEMA: "postgresql://user:pass@<rds-endpoint>:5432/cinema"
  DB_GROUPS: "postgresql://user:pass@<rds-endpoint>:5432/groups"
  DB_AUTH: "postgresql://user:pass@<rds-endpoint>:5432/auth"
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_FROM: ""
