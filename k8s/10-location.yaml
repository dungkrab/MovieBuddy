apiVersion: apps/v1
kind: Deployment
metadata: { name: location, labels: { app: location } }
spec:
  replicas: 2
  selector: { matchLabels: { app: location } }
  template:
    metadata: { labels: { app: location, tier: internal } }
    spec:
      containers:
      - name: location
        image: REGISTRY/movie-groups-location:latest   # แทน REGISTRY ด้วย ECR repo ของคุณ
        ports: [{ containerPort: 4001 }]
        envFrom: [{ configMapRef: { name: service-urls } }]
        env:
        - { name: INTERNAL_KEY, valueFrom: { secretKeyRef: { name: app-secrets, key: INTERNAL_KEY } } }
        - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: app-secrets, key: DB_LOCATION } } }
        readinessProbe: { httpGet: { path: /health, port: 4001 }, periodSeconds: 5 }
        livenessProbe: { httpGet: { path: /health, port: 4001 }, initialDelaySeconds: 20, periodSeconds: 10 }
        resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: location }
spec:
  selector: { app: location }
  ports: [{ port: 4001, targetPort: 4001 }]
