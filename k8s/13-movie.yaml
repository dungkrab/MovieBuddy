apiVersion: apps/v1
kind: Deployment
metadata: { name: movie, labels: { app: movie } }
spec:
  replicas: 2
  selector: { matchLabels: { app: movie } }
  template:
    metadata: { labels: { app: movie, tier: internal } }
    spec:
      containers:
      - name: movie
        image: REGISTRY/movie-groups-movie:latest   # แทน REGISTRY ด้วย ECR repo ของคุณ
        ports: [{ containerPort: 4004 }]
        envFrom: [{ configMapRef: { name: service-urls } }]
        env:
        - { name: INTERNAL_KEY, valueFrom: { secretKeyRef: { name: app-secrets, key: INTERNAL_KEY } } }
        - { name: TMDB_ACCESS_TOKEN, valueFrom: { secretKeyRef: { name: app-secrets, key: TMDB_ACCESS_TOKEN } } }
        - { name: REDIS_URL, valueFrom: { secretKeyRef: { name: app-secrets, key: REDIS_URL } } }
        readinessProbe: { httpGet: { path: /health, port: 4004 }, periodSeconds: 5 }
        livenessProbe: { httpGet: { path: /health, port: 4004 }, initialDelaySeconds: 20, periodSeconds: 10 }
        resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: movie }
spec:
  selector: { app: movie }
  ports: [{ port: 4004, targetPort: 4004 }]
