apiVersion: apps/v1
kind: Deployment
metadata: { name: web, labels: { app: web } }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web, tier: edge } }
    spec:
      containers:
      - name: web
        image: REGISTRY/movie-groups-web:latest   # แทน REGISTRY ด้วย ECR repo ของคุณ
        ports: [{ containerPort: 3000 }]
        envFrom: [{ configMapRef: { name: service-urls } }]
        env:
        - { name: INTERNAL_KEY, valueFrom: { secretKeyRef: { name: app-secrets, key: INTERNAL_KEY } } }
        readinessProbe: { httpGet: { path: /, port: 3000 }, periodSeconds: 5 }
        livenessProbe: { httpGet: { path: /, port: 3000 }, initialDelaySeconds: 20, periodSeconds: 10 }
        resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: web }
spec:
  selector: { app: web }
  ports: [{ port: 3000, targetPort: 3000 }]
