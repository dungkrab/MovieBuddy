# เปิดสู่ภายนอกเฉพาะ web (ผ่าน AWS Load Balancer Controller → ALB)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  ingressClassName: alb
  rules:
  - host: movies.example.com
    http:
      paths: [{ path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 3000 } } } }]
---
# service ภายในรับการเรียกจาก web และ group (group → location) เท่านั้น
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: internal-only-from-web }
spec:
  podSelector: { matchLabels: { tier: internal } }
  policyTypes: [Ingress]
  ingress:
  - from: [{ podSelector: { matchExpressions: [{ key: app, operator: In, values: [web, group] }] } }]
