apiVersion: apps/v1
kind: Deployment
metadata: { name: showtime, labels: { app: showtime } }
spec:
  replicas: 2
  selector: { matchLabels: { app: showtime } }
  template:
    metadata: { labels: { app: showtime, tier: internal } }
    spec:
      containers:
      - name: showtime
        image: REGISTRY/movie-groups-showtime:latest   # แทน REGISTRY ด้วย ECR repo ของคุณ
        ports: [{ containerPort: 4003 }]
        envFrom: [{ configMapRef: { name: service-urls } }]
        env:
        - { name: INTERNAL_KEY, valueFrom: { secretKeyRef: { name: app-secrets, key: INTERNAL_KEY } } }
        readinessProbe: { httpGet: { path: /health, port: 4003 }, periodSeconds: 5 }
        livenessProbe: { httpGet: { path: /health, port: 4003 }, initialDelaySeconds: 20, periodSeconds: 10 }
        resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: showtime }
spec:
  selector: { app: showtime }
  ports: [{ port: 4003, targetPort: 4003 }]
