apiVersion: apps/v1
kind: Deployment
metadata: { name: auth, labels: { app: auth } }
spec:
  replicas: 2
  selector: { matchLabels: { app: auth } }
  template:
    metadata: { labels: { app: auth, tier: internal } }
    spec:
      containers:
      - name: auth
        image: REGISTRY/movie-groups-auth:latest   # แทน REGISTRY ด้วย ECR repo ของคุณ
        ports: [{ containerPort: 4006 }]
        envFrom: [{ configMapRef: { name: service-urls } }]
        env:
        - { name: INTERNAL_KEY, valueFrom: { secretKeyRef: { name: app-secrets, key: INTERNAL_KEY } } }
        - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: app-secrets, key: DB_AUTH } } }
        - { name: AUTH_SECRET, valueFrom: { secretKeyRef: { name: app-secrets, key: AUTH_SECRET } } }
        - { name: SMS_PROVIDER, value: twilio }
        - { name: TWILIO_ACCOUNT_SID, valueFrom: { secretKeyRef: { name: app-secrets, key: TWILIO_ACCOUNT_SID } } }
        - { name: TWILIO_AUTH_TOKEN, valueFrom: { secretKeyRef: { name: app-secrets, key: TWILIO_AUTH_TOKEN } } }
        - { name: TWILIO_FROM, valueFrom: { secretKeyRef: { name: app-secrets, key: TWILIO_FROM } } }
        readinessProbe: { httpGet: { path: /health, port: 4006 }, periodSeconds: 5 }
        livenessProbe: { httpGet: { path: /health, port: 4006 }, initialDelaySeconds: 20, periodSeconds: 10 }
        resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: auth }
spec:
  selector: { app: auth }
  ports: [{ port: 4006, targetPort: 4006 }]
