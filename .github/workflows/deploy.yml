name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # ให้ GitHub ขอ token ชั่วคราวเพื่อ assume IAM role (OIDC) — ไม่ต้องเก็บ access key
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}          # เช่น ap-southeast-1
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}        # ชื่อ ECS cluster
  NAME_PREFIX: ${{ vars.NAME_PREFIX }}        # เช่น moviebuddy → ECR repo, ECS service และ task family = moviebuddy-<service>

jobs:
  # 1) หาว่า service ไหนมีไฟล์เปลี่ยน → build/deploy เฉพาะตัวนั้น
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.diff.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: diff
        run: |
          ALL='["web","auth","movie","location","cinema","group","chat","showtime"]'
          BASE="${{ github.event.before || github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "services=$ALL" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CH=$(git diff --name-only "$BASE" "${{ github.sha }}")
          if echo "$CH" | grep -q '^services/shared/'; then echo "services=$ALL" >> "$GITHUB_OUTPUT"; exit 0; fi
          list=()
          for s in auth movie location cinema group chat showtime; do
            echo "$CH" | grep -q "^services/$s/" && list+=("$s")
          done
          echo "$CH" | grep -q '^web/' && list+=("web")
          echo "services=$(jq -nc '$ARGS.positional' --args "${list[@]}")" >> "$GITHUB_OUTPUT"

  # 2) build image (ทุก PR และทุก push); push ขึ้น ECR + deploy เฉพาะ push เข้า main
  build-deploy:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Dockerfile
        id: df
        run: |
          if [ "${{ matrix.service }}" = "web" ]; then echo "path=web/Dockerfile" >> "$GITHUB_OUTPUT"
          else echo "path=services/${{ matrix.service }}/Dockerfile" >> "$GITHUB_OUTPUT"; fi

      - name: Build (PR: ตรวจว่า build ผ่านเท่านั้น)
        if: github.event_name == 'pull_request'
        run: docker build -f "${{ steps.df.outputs.path }}" -t "${{ matrix.service }}:pr" .

      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

        if: github.event_name == 'push'
        id: image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${NAME_PREFIX}-${{ matrix.service }}:${{ github.sha }}"
          docker build -f "${{ steps.df.outputs.path }}" -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # ดึง task definition ปัจจุบันมาเปลี่ยนเฉพาะ image แล้วลงทะเบียนเป็น revision ใหม่ (env/secret ที่ตั้งไว้ยังอยู่)
      - name: Get current task definition
        if: github.event_name == 'push'
        run: |
          aws ecs describe-task-definition --task-definition "${NAME_PREFIX}-${{ matrix.service }}" \
            --query taskDefinition > task-def.json

      - name: Render task definition with new image
        if: github.event_name == 'push'
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ matrix.service }}    # ต้องตรงกับชื่อ container ใน task definition
          image: ${{ steps.image.outputs.image }}

      - name: Deploy to ECS (rolling update) and wait until stable
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.NAME_PREFIX }}-${{ matrix.service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10