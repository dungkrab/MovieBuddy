apiVersion: apps/v1
kind: Deployment
metadata: { name: cinema, labels: { app: cinema } }
spec:
  replicas: 2
  selector: { matchLabels: { app: cinema } }
  template:
    metadata: { labels: { app: cinema, tier: internal } }
    spec:
      containers:
      - name: cinema
        image: REGISTRY/movie-groups-cinema:latest   # แทน REGISTRY ด้วย ECR repo ของคุณ
        ports: [{ containerPort: 4002 }]
        envFrom: [{ configMapRef: { name: service-urls } }]
        env:
        - { name: INTERNAL_KEY, valueFrom: { secretKeyRef: { name: app-secrets, key: INTERNAL_KEY } } }
        - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: app-secrets, key: DB_CINEMA } } }
        readinessProbe: { httpGet: { path: /health, port: 4002 }, periodSeconds: 5 }
        livenessProbe: { httpGet: { path: /health, port: 4002 }, initialDelaySeconds: 20, periodSeconds: 10 }
        resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: cinema }
spec:
  selector: { app: cinema }
  ports: [{ port: 4002, targetPort: 4002 }]
