
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  NAME_PREFIX: ${{ vars.NAME_PREFIX }}

jobs:
  # 1. Detect changed services
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.diff.outputs.services }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: diff
        shell: bash
        run: |
          ALL='["web","auth","movie","location","cinema","group","chat","showtime"]'

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          if [ -z "$BASE" ] || \
             [ "$BASE" = "0000000000000000000000000000000000000000" ] || \
             ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "services=$ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CH=$(git diff --name-only "$BASE" "${{ github.sha }}")

          # Shared files or root-level changes trigger all services
          if echo "$CH" | grep -q '^services/shared/' || \
             echo "$CH" | grep -qvE '^(services/(auth|movie|location|cinema|group|chat|showtime)/|web/)'; then
            echo "services=$ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          list=()

          for s in auth movie location cinema group chat showtime; do
            if echo "$CH" | grep -q "^services/$s/"; then
              list+=("$s")
            fi
          done

          if echo "$CH" | grep -q '^web/'; then
            list+=("web")
          fi

          SERVICES=$(jq -nc '$ARGS.positional' --args "${list[@]}")
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

          echo "Changed services: $SERVICES"

  # 2. Build and deploy changed services
  build-deploy:
    needs: changes
    if: needs.changes.outputs.services != '[]'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Resolve Dockerfile path
      - name: Resolve Dockerfile
        id: df
        shell: bash
        run: |
          if [ "${{ matrix.service }}" = "web" ]; then
            echo "path=web/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "path=services/${{ matrix.service }}/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      # PR: Build only, never access AWS
      - name: Build Docker Image (PR)
        if: github.event_name == 'pull_request'
        run: |
          docker build \
            -f "${{ steps.df.outputs.path }}" \
            -t "${{ matrix.service }}:pr" .

      # Push to main: Authenticate with AWS
      - name: Configure AWS Credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build and push image
      - name: Build and Push Image
        if: github.event_name == 'push'
        id: image
        shell: bash
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${NAME_PREFIX}-${{ matrix.service }}:${{ github.sha }}"

          docker build \
            -f "${{ steps.df.outputs.path }}" \
            -t "$IMAGE" .

          docker push "$IMAGE"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # Get current task definition
      - name: Get current task definition
        if: github.event_name == 'push'
        run: |
          aws ecs describe-task-definition \
            --task-definition "${NAME_PREFIX}-${{ matrix.service }}" \
            --query taskDefinition > task-def.json

      # Update container image
      - name: Render task definition
        if: github.event_name == 'push'
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ matrix.service }}
          image: ${{ steps.image.outputs.image }}

      # Deploy to ECS
      - name: Deploy to ECS
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.NAME_PREFIX }}-${{ matrix.service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10
